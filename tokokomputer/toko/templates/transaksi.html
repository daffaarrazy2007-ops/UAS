<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Transaksi</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4 text-center">🧾 Transaksi Penjualan</h2>

    <div class="mb-3">
        <a href="/produk/" class="btn btn-secondary">📦 Produk</a>
        <a href="/transaksi/riwayat/" class="btn btn-info">📜 Riwayat Transaksi</a>
    </div>

    <form method="POST">
        {% csrf_token %}

        <table class="table table-bordered table-striped table-hover">
            <thead class="table-dark text-center">
                <tr>
                    <th>Produk</th>
                    <th>Harga</th>
                    <th>Stok</th>
                    <th>Jumlah Beli</th>
                </tr>
            </thead>
            <tbody>
                {% for p in produk %}
                <tr>
                    <td>{{ p.nama }}</td>
                    <td>Rp {{ p.harga }}</td>
                    <td class="text-center">{{ p.stok }}</td>
                    <td>
                        <input 
                            type="number"
                            name="{{ p.id }}"
                            class="form-control"
                            min="0"
                            max="{{ p.stok }}"
                            value="0">
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center text-muted">
                        Tidak ada produk
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="text-end">
            <button type="submit" class="btn btn-success">
                💾 Simpan Transaksi
            </button>
        </div>
    </form>

</div>

</body>
</html>

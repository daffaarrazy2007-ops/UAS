{% extends 'base.html' %}
{% block content %}
<h3>Produk</h3>
<a href="/produk/tambah/" class="btn btn-primary">Tambah Produk</a>
<table class="table mt-3">
<tr><th>Nama</th><th>Harga</th><th>Stok</th></tr>
{% for p in produk %}
<tr>
<td>{{ p.nama }}</td>
<td>{{ p.harga }}</td>
<td>{{ p.stok }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
